name: E2E benchmark diagnosis

on:
  workflow_dispatch:
    inputs:
      test_case:
        description: Terraform semantic failure case
        required: true
        type: choice
        options:
          - dynamodb-key-schema-failure
          - ebs-throughput-volume-type-failure
          - s3-bucket-naming-conflict-failure

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2e-benchmark-${{ github.ref }}-${{ github.event.inputs.test_case }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  TERRAFORM_VERSION: "1.15.7"
  BENCHMARK_REPOSITORY: JalinaH/terraform-failure-benchmarks
  BENCHMARK_REF: main
  BENCHMARK_PATH: terraform-failure-benchmarks
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_name_prefix: stfa-agent-${{ github.repository_id }}-${{ github.run_id }}

jobs:
  e2e:
    name: Diagnose and verify ${{ github.event.inputs.test_case }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Semantic Terraform Failure Agent
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out Terraform failure benchmarks
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BENCHMARK_REPOSITORY }}
          ref: ${{ env.BENCHMARK_REF }}
          token: ${{ secrets.BENCHMARK_REPO_TOKEN }}
          path: ${{ env.BENCHMARK_PATH }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve selected benchmark case
        shell: bash
        env:
          SELECTED_TEST_CASE: ${{ github.event.inputs.test_case }}
        run: |
          set -euo pipefail
          case "${SELECTED_TEST_CASE}" in
            dynamodb-key-schema-failure)
              benchmark_case="cases/dynamodb-key-schema-failure"
              benchmark_log="collected-runs/terraform-logs-dynamodb-key-schema-failure/plan.stderr.log"
              expected_resource_type="aws_dynamodb_table"
              ;;
            ebs-throughput-volume-type-failure)
              benchmark_case="cases/ebs-throughput-volume-type-failure"
              benchmark_log="collected-runs/terraform-logs-ebs-throughput-volume-type-failure/plan.stderr.log"
              expected_resource_type="aws_ebs_volume"
              ;;
            s3-bucket-naming-conflict-failure)
              benchmark_case="cases/s3-bucket-naming-conflict-failure"
              benchmark_log="collected-runs/terraform-logs-s3-bucket-naming-conflict-failure/plan.stderr.log"
              expected_resource_type="aws_s3_bucket"
              ;;
            *)
              echo "::error::Unknown benchmark case: ${SELECTED_TEST_CASE}"
              exit 1
              ;;
          esac
          {
            echo "SELECTED_TEST_CASE=${SELECTED_TEST_CASE}"
            echo "BENCHMARK_CASE=${benchmark_case}"
            echo "BENCHMARK_LOG=${benchmark_log}"
            echo "EXPECTED_RESOURCE_TYPE=${expected_resource_type}"
          } >> "${GITHUB_ENV}"

      - name: Validate selected benchmark paths
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          benchmark_root="${GITHUB_WORKSPACE}/${BENCHMARK_PATH}"
          terraform_directory="${benchmark_root}/${BENCHMARK_CASE}"
          plan_log="${benchmark_root}/${BENCHMARK_LOG}"

          if [[ ! -d "${terraform_directory}" ]]; then
            echo "::error::Benchmark Terraform directory does not exist: ${terraform_directory}"
            exit 1
          fi
          terraform_files=("${terraform_directory}"/*.tf "${terraform_directory}"/*.tf.json)
          if (( ${#terraform_files[@]} == 0 )); then
            echo "::error::Benchmark Terraform directory contains no Terraform files: ${terraform_directory}"
            exit 1
          fi
          if [[ ! -f "${plan_log}" ]]; then
            echo "::error::Benchmark plan log does not exist: ${plan_log}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Semantic Terraform Failure Agent
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check .
          semantic-terraform-agent --help >/dev/null

      - name: Check required E2E settings
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ROLE_ARN}" || -z "${AWS_REGION}" ]]; then
            echo "::error::Set repository variables AWS_ROLE_ARN and AWS_REGION."
            exit 1
          fi
          if [[ -z "${GEMINI_API_KEY}" ]]; then
            echo "::error::Set the GEMINI_API_KEY repository secret."
            exit 1
          fi

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: semantic-tf-agent-${{ github.run_id }}

      - name: Run agent against selected Terraform failure
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESULT_PATH: ${{ runner.temp }}/semantic-terraform-agent/result.json
          SEMANTIC_TERRAFORM_AGENT_PASSTHROUGH_ENV: >-
            AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION,AWS_DEFAULT_REGION
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${RESULT_PATH}")"
          semantic-terraform-agent diagnose \
            --repo-path "${GITHUB_WORKSPACE}/${BENCHMARK_PATH}" \
            --terraform-dir "${BENCHMARK_CASE}" \
            --log-file "${GITHUB_WORKSPACE}/${BENCHMARK_PATH}/${BENCHMARK_LOG}" \
            --failed-stage plan \
            --provider gemini \
            --model gemini-3.6-flash \
            --context-mode auto \
            --verify-patch \
            --max-repair-attempts 1 \
            --output "${RESULT_PATH}"

      - name: Require successful isolated verification
        shell: bash
        env:
          RESULT_PATH: ${{ runner.temp }}/semantic-terraform-agent/result.json
        run: |
          set -euo pipefail
          python - "${RESULT_PATH}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          result_path = pathlib.Path(sys.argv[1])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          errors = []

          if result.get("status") != "ok":
              errors.append(f"result status is not ok: {result.get('status')}")

          diagnosis = result.get("diagnosis") or {}
          final_candidate = diagnosis.get("repair") or diagnosis.get("initial") or {}
          affected_resources = final_candidate.get("affected_resources") or []
          expected_resource_type = os.environ["EXPECTED_RESOURCE_TYPE"]
          schemas = (result.get("terraform") or {}).get("schemas") or []
          resource_type_found = any(
              expected_resource_type in address for address in affected_resources
          ) or any(
              expected_resource_type == schema.get("resource_type")
              or expected_resource_type in json.dumps(schema.get("schema") or {})
              for schema in schemas
              if isinstance(schema, dict)
          )

          verification_status = diagnosis.get("verification_status")
          verification = diagnosis.get("verification") or {}
          attempts = diagnosis.get("attempts") or []
          final_attempt = attempts[-1] if attempts else {}
          plan = (final_attempt.get("commands") or {}).get("plan") or {}

          if not affected_resources:
              errors.append("diagnosis contains no affected resources")
          if not resource_type_found:
              errors.append(
                  f"expected resource type was not found in resources or schemas: "
                  f"{expected_resource_type}"
              )
          if not str(diagnosis.get("final_patch") or "").strip():
              errors.append("diagnosis.final_patch is empty")
          if verification_status not in {
              "verified_first_attempt",
              "verified_after_retry",
          }:
              errors.append(f"verification did not pass: {verification_status}")
          if verification.get("passed") is not True:
              errors.append("diagnosis.verification.passed is not true")
          if not attempts:
              errors.append("diagnosis contains no verification attempts")
          if plan.get("status") != "passed":
              errors.append(f"final plan command did not pass: {plan.get('status')}")
          if plan.get("exit_code") != 0:
              errors.append(f"final plan exit code is not zero: {plan.get('exit_code')}")

          selected_case = os.environ["SELECTED_TEST_CASE"]
          affected_resource = affected_resources[0] if affected_resources else "unavailable"
          context_mode = (result.get("context") or {}).get("selected_mode", "unavailable")
          repair_used = diagnosis.get("repair") is not None
          timing = result.get("timing") or {}
          token_usage = result.get("token_usage") or {}

          print(f"Case: {selected_case}")
          print(f"Affected resource: {affected_resource}")
          print(f"Context mode: {context_mode}")
          print(f"Verification: {verification_status}")
          print(f"Attempts: {len(attempts)}")
          print(f"Plan exit code: {plan.get('exit_code')}")

          summary = "\n".join(
              [
                  "# Semantic Terraform Agent E2E",
                  "",
                  f"- Case: `{selected_case}`",
                  f"- Resource: `{affected_resource}`",
                  f"- Context mode: `{context_mode}`",
                  f"- Verification status: `{verification_status}`",
                  f"- Repair used: `{'yes' if repair_used else 'no'}`",
                  f"- Total runtime: `{timing.get('total_seconds', 'unavailable')} seconds`",
                  f"- Input tokens: `{token_usage.get('input_tokens', 'unavailable')}`",
                  f"- Output tokens: `{token_usage.get('output_tokens', 'unavailable')}`",
                  "",
              ]
          )
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              summary, encoding="utf-8"
          )

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit("E2E result assertions failed")
          PY

      - name: Verify benchmark repository isolation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          benchmark_root="${GITHUB_WORKSPACE}/${BENCHMARK_PATH}"
          if [[ ! -d "${benchmark_root}/.git" ]]; then
            echo "::error::Benchmark Git checkout is unavailable: ${benchmark_root}"
            exit 1
          fi
          changes="$(git -C "${benchmark_root}" status --porcelain=v1 --untracked-files=all)"
          if [[ -n "${changes}" ]]; then
            echo "::error::The agent modified the benchmark repository."
            while IFS= read -r change; do
              printf '%s\n' "${change:3}"
            done <<< "${changes}"
            exit 1
          fi
          echo "Benchmark repository remained unchanged."

      - name: Upload E2E diagnosis result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-terraform-agent-e2e-${{ github.event.inputs.test_case }}-${{ github.run_number }}
          path: ${{ runner.temp }}/semantic-terraform-agent/result.json
          if-no-files-found: warn
          retention-days: 30
